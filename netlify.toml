# =============================================================================
# قلم | QALAM — Netlify configuration
# =============================================================================

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps=false"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  publish = "dist"

# SPA fallback — كل المسارات تُخدَم من index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# =============================================================================
# رؤوس أمان
#
# الـCSP مبنية على ما يحتاجه التطبيق فعليًا — تم التحقق من dist/index.html:
#   - لا سكربت مضمّن إطلاقًا (Vite يُخرج <script src>) ⇒ script-src 'self' بلا unsafe-inline
#   - خطوط Google: stylesheet من fonts.googleapis.com وملفات الخط من fonts.gstatic.com
#   - 'unsafe-inline' في style-src ضرورية لخاصية style={{…}} في React (سمات style)
#   - connect-src: Supabase فقط (REST + Auth + Realtime عبر wss)
#
# ملاحظة على النطاق: *.supabase.co أوسع من مشروع واحد، لكن ملف netlify.toml
# ثابت ولا يقرأ متغيرات البيئة. الفائدة الأساسية محفوظة: لا يمكن للصفحة إرسال
# بيانات إلى أي مستضيف آخر. لتضييقه إلى مشروع واحد يلزم توليد ملف _headers
# وقت البناء — موثّق في docs/security.md.
#
# الميكروفون (المرحلة ٦ — Voice AI): مسموح لأصل الموقع وحده — microphone=(self).
# لا إطار ولا نطاق فرعي ولا طرف ثالث. والصفحة لا تطلب الصلاحية عند التحميل،
# بل عند ضغط زر الصوت فقط.
#
# لم تتغيّر الـCSP: الصوت لا يضيف مستضيفًا خارجيًا — التحويل النصي يمر بدالة
# على نفس الأصل، والنطق يتم في المتصفح بلا شبكة. media-src يسمح بـblob:
# لتشغيل ما يُنتجه المتصفح محليًا.
# =============================================================================
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """\
default-src 'self'; \
script-src 'self'; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
font-src 'self' https://fonts.gstatic.com data:; \
img-src 'self' data: blob:; \
connect-src 'self' https://*.supabase.co wss://*.supabase.co; \
media-src 'self' blob:; \
worker-src 'self' blob:; \
manifest-src 'self'; \
object-src 'none'; \
base-uri 'self'; \
form-action 'self'; \
frame-src 'none'; \
frame-ancestors 'none'; \
upgrade-insecure-requests"""
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"

# دوال الخادم: لا تُخزَّن استجاباتها إطلاقًا.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
